<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
 
<!-- Fragmento 1: cabecera común (título + Bootstrap) -->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Andes Fresh'">Andes Fresh</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
 
<body>
 
<!-- Fragmento 2: barra de navegación -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">ANDES FRESH</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
 
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Productos</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/productos}">Catálogo</a></li>
            <li><a class="dropdown-item" th:href="@{/consultas/productos}">Buscar por marca y categoría</a></li>
          </ul>
        </li>
 
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Empleados</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/empleados}">Listado</a></li>
            <li><a class="dropdown-item" th:href="@{/empleados/nuevo}">Nuevo empleado</a></li>
          </ul>
        </li>
 
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Reportes</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/consultas/resumen}">Resumen por categoría</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" th:href="@{/reportes/csv}">Exportar CSV</a></li>
            <li><a class="dropdown-item" th:href="@{/reportes/excel}">Exportar Excel</a></li>
            <li><a class="dropdown-item" th:href="@{/reportes/pdf}" target="_blank">Ver PDF</a></li>
          </ul>
        </li>
 
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">API</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/api/productos}" target="_blank">Productos en JSON</a></li>
            <li><a class="dropdown-item" th:href="@{/api/productos/xml}" target="_blank">Productos en XML</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
 
<!-- Fragmento 3: JavaScript de Bootstrap (necesario para los menús desplegables) -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
 
</body>
</html>
